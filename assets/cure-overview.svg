<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">CURE framework overview</title>
  <desc id="desc">Heterogeneous medical modalities pass through cascaded HyFuse layers, each composed of EMRC, HySAM, LLF, and SIR, before heterogeneous multitask heads.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#13233f"/>
    </linearGradient>
    <linearGradient id="fusion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d5dfc"/>
      <stop offset="100%" stop-color="#31c4f3"/>
    </linearGradient>
    <linearGradient id="shared" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36d1a3"/>
      <stop offset="100%" stop-color="#78e5bd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#9db6d7"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, Arial, sans-serif; fill: #f8fbff; }
      .subtitle { font: 500 20px Inter, Arial, sans-serif; fill: #b9c9df; }
      .section { font: 700 22px Inter, Arial, sans-serif; fill: #eaf2ff; letter-spacing: .5px; }
      .cardTitle { font: 700 20px Inter, Arial, sans-serif; fill: #f8fbff; }
      .cardText { font: 500 15px Inter, Arial, sans-serif; fill: #c4d3e7; }
      .small { font: 600 14px Inter, Arial, sans-serif; fill: #d6e2f2; }
      .tiny { font: 500 12px Inter, Arial, sans-serif; fill: #aec0d8; }
      .chip { font: 700 14px Inter, Arial, sans-serif; fill: #eaf8ff; }
    </style>
  </defs>

  <rect width="1800" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="155" cy="92" r="130" fill="#643dff" opacity="0.13"/>
  <circle cx="1640" cy="760" r="190" fill="#00d7af" opacity="0.08"/>

  <text x="900" y="68" text-anchor="middle" class="title">CURE</text>
  <text x="900" y="102" text-anchor="middle" class="subtitle">Cascaded Unified Representation Learning for Efficient Fusion</text>

  <!-- Left: modalities -->
  <text x="185" y="158" text-anchor="middle" class="section">Heterogeneous Inputs</text>

  <g filter="url(#shadow)">
    <rect x="55" y="190" width="260" height="118" rx="22" fill="#172b49" stroke="#4b6f9e" stroke-width="2"/>
    <circle cx="92" cy="230" r="20" fill="#2f7df6"/>
    <path d="M81 231 h22 M92 220 v22" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="126" y="228" class="cardTitle">Medical imaging</text>
    <text x="78" y="265" class="cardText">Dermoscopy · CT · MRI · WSI</text>
    <text x="78" y="289" class="tiny">spatial tensors</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="55" y="330" width="260" height="118" rx="22" fill="#172b49" stroke="#4b6f9e" stroke-width="2"/>
    <circle cx="92" cy="370" r="20" fill="#8b5cf6"/>
    <circle cx="87" cy="366" r="4" fill="#fff"/><circle cx="98" cy="375" r="4" fill="#fff"/><path d="M87 366 L98 375 M98 375 L87 383" stroke="#fff" stroke-width="2"/>
    <text x="126" y="368" class="cardTitle">Multi-omics</text>
    <text x="78" y="405" class="cardText">Genomics · transcriptomics</text>
    <text x="78" y="429" class="tiny">vectors → pseudo-images</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="55" y="470" width="260" height="118" rx="22" fill="#172b49" stroke="#4b6f9e" stroke-width="2"/>
    <circle cx="92" cy="510" r="20" fill="#16b99a"/>
    <path d="M78 514 h8 l5-12 8 24 6-12 h8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="126" y="508" class="cardTitle">EHR &amp; time series</text>
    <text x="78" y="545" class="cardText">Clinical records · wearables</text>
    <text x="78" y="569" class="tiny">structured temporal inputs</text>
  </g>

  <!-- arrows into cascade -->
  <path d="M320 250 C370 250 380 245 418 245" stroke="#9db6d7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M320 390 C365 390 382 320 418 295" stroke="#9db6d7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M320 530 C365 530 385 385 418 345" stroke="#9db6d7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Center cascade -->
  <text x="845" y="158" text-anchor="middle" class="section">MSIL · Cascaded Shared Information Learning</text>

  <g filter="url(#shadow)">
    <rect x="420" y="195" width="230" height="150" rx="26" fill="url(#fusion)"/>
    <text x="535" y="236" text-anchor="middle" class="cardTitle">HyFuse 1</text>
    <text x="535" y="268" text-anchor="middle" class="small">x₁ + x₂</text>
    <rect x="458" y="291" width="154" height="34" rx="17" fill="#0d203b" opacity="0.82"/>
    <text x="535" y="313" text-anchor="middle" class="small">shared s₂</text>
  </g>

  <path d="M655 270 H718" stroke="#9db6d7" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="720" y="195" width="230" height="150" rx="26" fill="url(#fusion)"/>
    <text x="835" y="236" text-anchor="middle" class="cardTitle">HyFuse 2</text>
    <text x="835" y="268" text-anchor="middle" class="small">s₂ + x₃</text>
    <rect x="758" y="291" width="154" height="34" rx="17" fill="#0d203b" opacity="0.82"/>
    <text x="835" y="313" text-anchor="middle" class="small">shared s₃</text>
  </g>

  <path d="M955 270 H1013" stroke="#9db6d7" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="1038" y="279" text-anchor="middle" class="cardTitle">···</text>
  <path d="M1065 270 H1118" stroke="#9db6d7" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1120" y="195" width="230" height="150" rx="26" fill="url(#fusion)"/>
    <text x="1235" y="236" text-anchor="middle" class="cardTitle">HyFuse m−1</text>
    <text x="1235" y="268" text-anchor="middle" class="small">sₘ₋₁ + xₘ</text>
    <rect x="1158" y="291" width="154" height="34" rx="17" fill="#0d203b" opacity="0.82"/>
    <text x="1235" y="313" text-anchor="middle" class="small">shared sₘ</text>
  </g>

  <!-- Expanded HyFuse -->
  <g filter="url(#shadow)">
    <rect x="410" y="395" width="950" height="285" rx="30" fill="#101f37" stroke="#38577e" stroke-width="2"/>
    <text x="885" y="435" text-anchor="middle" class="section">One HyFuse layer</text>

    <rect x="450" y="475" width="190" height="130" rx="22" fill="#1e426b"/>
    <text x="545" y="515" text-anchor="middle" class="cardTitle">EMRC</text>
    <text x="545" y="547" text-anchor="middle" class="small">multi-scale cues</text>
    <text x="545" y="572" text-anchor="middle" class="tiny">efficient residual</text>
    <text x="545" y="590" text-anchor="middle" class="tiny">heterogeneous convolutions</text>

    <path d="M645 540 H690" stroke="#9db6d7" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="692" y="462" width="330" height="156" rx="24" fill="#2b245c" stroke="#7e6df8" stroke-width="2"/>
    <text x="857" y="500" text-anchor="middle" class="cardTitle">HySAM</text>
    <rect x="718" y="520" width="132" height="64" rx="16" fill="#472f8f"/>
    <text x="784" y="546" text-anchor="middle" class="small">Hyperbolic</text>
    <text x="784" y="566" text-anchor="middle" class="tiny">Lorentz + Poincaré</text>
    <rect x="864" y="520" width="132" height="64" rx="16" fill="#28548c"/>
    <text x="930" y="546" text-anchor="middle" class="small">Quantum-inspired</text>
    <text x="930" y="566" text-anchor="middle" class="tiny">state interactions</text>
    <text x="857" y="606" text-anchor="middle" class="tiny">HQMGA mutual guidance → MAFG gating</text>

    <path d="M1028 540 H1068" stroke="#9db6d7" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1070" y="475" width="120" height="130" rx="22" fill="#1f6c69"/>
    <text x="1130" y="515" text-anchor="middle" class="cardTitle">LLF</text>
    <text x="1130" y="547" text-anchor="middle" class="small">adaptive</text>
    <text x="1130" y="569" text-anchor="middle" class="small">late fusion</text>
    <text x="1130" y="590" text-anchor="middle" class="tiny">learnable weights</text>

    <path d="M1195 540 H1233" stroke="#9db6d7" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1235" y="475" width="90" height="130" rx="22" fill="#2b6e50"/>
    <text x="1280" y="515" text-anchor="middle" class="cardTitle">SIR</text>
    <text x="1280" y="549" text-anchor="middle" class="small">shared</text>
    <text x="1280" y="571" text-anchor="middle" class="small">refinement</text>
  </g>

  <path d="M1360 270 H1412" stroke="#9db6d7" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Right output -->
  <text x="1585" y="158" text-anchor="middle" class="section">HMML · Multitask Heads</text>
  <g filter="url(#shadow)">
    <rect x="1420" y="195" width="330" height="485" rx="30" fill="#122844" stroke="#3d648f" stroke-width="2"/>
    <rect x="1470" y="225" width="230" height="76" rx="22" fill="url(#shared)"/>
    <text x="1585" y="257" text-anchor="middle" class="cardTitle" fill="#092033">Unified shared</text>
    <text x="1585" y="281" text-anchor="middle" class="small" fill="#092033">representation xᶜ</text>

    <path d="M1585 307 V340" stroke="#9db6d7" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1460" y="350" width="250" height="72" rx="20" fill="#203d62"/>
    <text x="1585" y="380" text-anchor="middle" class="cardTitle">Disease classification</text>
    <text x="1585" y="405" text-anchor="middle" class="tiny">ACC · AUC</text>

    <rect x="1460" y="438" width="250" height="72" rx="20" fill="#203d62"/>
    <text x="1585" y="468" text-anchor="middle" class="cardTitle">Survival prediction</text>
    <text x="1585" y="493" text-anchor="middle" class="tiny">C-index</text>

    <rect x="1460" y="526" width="250" height="72" rx="20" fill="#203d62"/>
    <text x="1585" y="556" text-anchor="middle" class="cardTitle">Mortality &amp; EHR tasks</text>
    <text x="1585" y="581" text-anchor="middle" class="tiny">clinical multitask learning</text>

    <rect x="1460" y="614" width="250" height="42" rx="18" fill="#273a56"/>
    <text x="1585" y="640" text-anchor="middle" class="small">activity recognition</text>
  </g>

  <!-- Bottom chips -->
  <g>
    <rect x="190" y="750" width="235" height="58" rx="29" fill="#173655" stroke="#3d6a95"/>
    <text x="307" y="785" text-anchor="middle" class="chip">16 public datasets</text>
    <rect x="455" y="750" width="235" height="58" rx="29" fill="#173655" stroke="#3d6a95"/>
    <text x="572" y="785" text-anchor="middle" class="chip">5 backbone variants</text>
    <rect x="720" y="750" width="235" height="58" rx="29" fill="#173655" stroke="#3d6a95"/>
    <text x="837" y="785" text-anchor="middle" class="chip">paired + unpaired</text>
    <rect x="985" y="750" width="270" height="58" rx="29" fill="#173655" stroke="#3d6a95"/>
    <text x="1120" y="785" text-anchor="middle" class="chip">missing-modality evaluation</text>
    <rect x="1285" y="750" width="325" height="58" rx="29" fill="#173655" stroke="#3d6a95"/>
    <text x="1447" y="785" text-anchor="middle" class="chip">up to 87.8% lower computation</text>
  </g>

  <text x="900" y="852" text-anchor="middle" class="subtitle">Hybrid intermediate + late fusion · modality-order-invariant shared learning · heterogeneous medical multitask prediction</text>
</svg>
